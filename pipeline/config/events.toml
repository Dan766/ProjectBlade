# Event taxonomy shared by the pipeline (what to generate) and the game's EventBus
# (what to emit). Event ids are a data contract: rename only with a matching game change.
#
# Per event:
#   group          grouping for reports
#   desc           what happened, from the SPEAKING PERSONA's point of view (goes into prompts)
#   channels       subset of: global (server chat), whisper (private to player), face (on-map encounter)
#   relationships  subset of: hostile, neutral, friendly, or ["any"] when it doesn't matter
#                  (default when omitted: all three bands)
#   placeholders   which {slots} a line may use; must be in [placeholders]
#   frequency      common | normal | rare -> min variants per cell, see pipeline.toml [scale.min_variants]

[relationship_bands]
hostile_below = -30
friendly_above = 30

[placeholders]
# Descriptions are shown to the model; write them from the SPEAKER's point of view.
player ="the human player: the person the line is about or spoken to"
persona = "YOUR OWN username as the speaker (never the human player's name)"
town = "a town name"
castle = "a castle name"
village = "a village name"
fief = "the town or castle this situation is about"
faction = "some other faction, not your own"
my_faction = "YOUR OWN faction"
enemy_faction = "a faction your faction is at war with"
rival = "another player YOU dislike (never the human player)"
troop_count = "a number of troops"
gold = "an amount of gold"

# --- Combat ------------------------------------------------------------------

[events.beat_by_player]
group = "combat"
desc = "You just lost a field battle to the player."
channels = ["global", "whisper", "face"]
placeholders = ["player", "troop_count"]
frequency = "common"

[events.beat_by_player_repeat]
group = "combat"
desc = "You lost to the player AGAIN, the third time or more. Escalating frustration, obsession or grudging respect."
channels = ["global", "whisper"]
placeholders = ["player", "troop_count"]
frequency = "normal"

[events.beat_player]
group = "combat"
desc = "You just defeated the player in a field battle."
channels = ["global", "whisper", "face"]
placeholders = ["player", "troop_count", "gold"]
frequency = "common"

[events.player_fled_from_me]
group = "combat"
desc = "The player's party ran away from your party on the map before a fight."
channels = ["global", "whisper"]
placeholders = ["player"]
frequency = "common"

[events.captured_by_player]
group = "combat"
desc = "The player has taken you prisoner after a battle. You are speaking to them as their captive."
channels = ["face"]
placeholders = ["player", "my_faction", "gold"]
frequency = "normal"

[events.released_by_player]
group = "combat"
desc = "The player released you from captivity instead of ransoming you."
channels = ["global", "whisper"]
placeholders = ["player"]
frequency = "normal"

[events.fought_alongside_player]
group = "combat"
desc = "You and the player just won a battle fighting on the same side."
channels = ["global", "whisper", "face"]
relationships = ["neutral", "friendly"]
placeholders = ["player", "troop_count", "enemy_faction"]
frequency = "normal"

